<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#067a53"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef5f1"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background (light — works on any tab color) -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)" stroke="#10b981" stroke-width="1" stroke-opacity="0.55"/>
  <!-- Sound wave bars -->
  <g fill="url(#green)">
    <rect x="6"   y="14" width="2.4" height="4"  rx="1.2"/>
    <rect x="9.6" y="11" width="2.4" height="10" rx="1.2"/>
    <rect x="13.2" y="8" width="2.4" height="16" rx="1.2"/>
    <rect x="16.8" y="6" width="2.4" height="20" rx="1.2"/>
    <rect x="20.4" y="9" width="2.4" height="14" rx="1.2"/>
    <rect x="24"  y="12" width="2.4" height="8"  rx="1.2"/>
  </g>
</svg>
